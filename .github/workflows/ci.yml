name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Deterministic quantities only: compiled program sizes and the
      # structural work bound. No wall-clock assertion runs in CI, because a
      # shared runner cannot measure one. The timing tables in the README say
      # which hardware they came from.
      - run: npm run bench:ci
      # Fails if a figure published in the README has drifted away from what
      # the tools actually produce.
      - run: npm run benchlock:check
